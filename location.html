<!DOCTYPE html>
<html>
<head>
    <title>Send Mobile GPS to C++</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }
        button{
            padding: 15px 25px;
            font-size: 18px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<h2>Send Mobile GPS to C++ Program</h2>
<p>Press the button to send your real-time location.</p>

<button onclick="sendLocation()">Send Location</button>

<p id="status" style="margin-top:20px; font-size:18px; color:green;"></p>

<script>
function sendLocation(){

    if(!navigator.geolocation){
        alert("Your device does not support GPS.");
        return;
    }

    document.getElementById('status').innerText = "Getting GPS location...";

    navigator.geolocation.getCurrentPosition(function(position){

        let lat = position.coords.latitude;
        let lon = position.coords.longitude;

        // Text that will be saved in file
        let text = lat + "," + lon;

        // Create a downloadable file
        let blob = new Blob([text], { type: "text/plain" });
        let url = URL.createObjectURL(blob);

        let link = document.createElement("a");
        link.href = url;
        link.download = "mobile_location.txt";
        link.click();

        document.getElementById('status').innerText =
            "Location Sent: " + lat.toFixed(6) + ", " + lon.toFixed(6);

    }, function(error){
        alert("GPS Permission Denied or Not Available.");
    });
}
</script>

</body>
</html>
