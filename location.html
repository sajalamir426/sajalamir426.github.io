<!DOCTYPE html>
<html>
<head>
  <title>Live Location</title>
</head>
<body>
  <h2>Get Real-Time Location</h2>

  <button onclick="getLocation()">Get Location</button>

  <p id="status"></p>

  <script>
    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition, showError);
      } else {
        document.getElementById("status").innerHTML = "Geolocation not supported!";
      }
    }

    function showPosition(position) {
      let lat = position.coords.latitude;
      let lon = position.coords.longitude;

      document.getElementById("status").innerHTML = 
        "Location fetched! Latitude: " + lat + " Longitude: " + lon;

      // File format required for C++
      let data = lat + " " + lon;

      // Force file name to usedata.txt
      let blob = new Blob([data], { type: "text/plain" });
      let link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "usedata.txt";
      link.click();
    }

    function showError(error) {
      document.getElementById("status").innerHTML = "Error getting location!";
    }
  </script>

</body>
</html>
